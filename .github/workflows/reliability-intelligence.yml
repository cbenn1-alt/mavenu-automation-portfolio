name: Reliability Intelligence V2 Contract Checks

on:
  push:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'
  pull_request:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic-only V2 charter contract tests
        working-directory: projects/reliability-intelligence
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m reliability_intelligence validate --json
          python -m unittest discover -s tests -v
