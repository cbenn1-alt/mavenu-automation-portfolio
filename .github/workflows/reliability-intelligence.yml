name: Reliability Intelligence Prototype Checks

on:
  push:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'
  pull_request:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test-only coverage tool
        working-directory: projects/reliability-intelligence
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run V24.1 V23 migration integration and V8–V24 transactional regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          test -d "$tmp/projects/reliability-intelligence"
          cd "$tmp/projects/reliability-intelligence"
          PYTHONPATH=src python scripts/verify_v8.py
          PYTHONPATH=src python scripts/replay_v9.py
          PYTHONPATH=src python scripts/verify_v10.py
          PYTHONPATH=src python scripts/verify_v11.py
          PYTHONPATH=src python scripts/verify_v12.py
          PYTHONPATH=src python scripts/verify_v13.py
          PYTHONPATH=src python scripts/verify_v14.py
          PYTHONPATH=src python scripts/verify_v15.py
          PYTHONPATH=src python scripts/verify_v16.py
          PYTHONPATH=src python scripts/verify_v17.py
          PYTHONPATH=src python scripts/verify_v18.py
          PYTHONPATH=src python scripts/verify_v19.py
          PYTHONPATH=src python scripts/verify_v20.py
          PYTHONPATH=src python scripts/verify_v21.py
          PYTHONPATH=src python scripts/verify_v22.py
          PYTHONPATH=src python scripts/verify_v23.py
          PYTHONPATH=src python scripts/verify_v24.py
          PYTHONPATH=src python scripts/verify_v24_1.py
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V8"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V9"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V10"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V11"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V12"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V13"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V14"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V15"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V16"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V17"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V18"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V19"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V20"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V21"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V22"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V23"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V24"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V24_1"
          cp evidence/V8/verification.json evidence/V8/coverage.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V8/"
          cp evidence/V9/replay.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V9/"
          cp evidence/V10/verification.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V10/"
          cp evidence/V11/verification.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V11/"
          cp evidence/V12/schema_validation_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V12/"
          cp evidence/V13/negative_case_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V13/"
          cp evidence/V14/repeated_ingest_comparison.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V14/"
          cp evidence/V15/conversion_reference_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V15/"
          cp evidence/V16/lineage_verification.json evidence/V16/record_level_trace_sample.json evidence/V16/synthetic_record_lineage.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V16/"
          cp evidence/V17/golden_reference_report.json evidence/V17/expected_output_comparison.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V17/"
          cp evidence/V18/adverse_regression_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V18/"
          cp evidence/V19/independent_reconciliation_report.json evidence/V19/independent_computation_results.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V19/"
          cp evidence/V20/verification.json evidence/V20/evidence_manifest.json evidence/V20/data_quality_signoff_packet.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V20/"
          cp evidence/V21/schema_review_validation.json evidence/V21/entity_relationship_catalog.json evidence/V21/unsigned_entity_schema_review.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V21/"
          cp evidence/V22/identity_reference_validation.json evidence/V22/uniqueness_link_matrix.json evidence/V22/unsigned_identity_review.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V22/"
          cp evidence/V23/up_down_migration_report.json evidence/V23/migration_failure_matrix.json evidence/V23/unsigned_migration_review.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V23/"
          cp evidence/V24/transactional_integrity_report.json evidence/V24/rollback_reopen_matrix.json evidence/V24/unsigned_persistence_review.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V24/"
          cp evidence/V24_1/migration_persistence_integration.json evidence/V24_1/bootstrap_and_recovery_matrix.json evidence/V24_1/unsigned_v24_1_review.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V24_1/"
      - name: Preserve V8–V24.1 synthetic migration and transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-intelligence-v24-1-evidence
          path: |
            projects/reliability-intelligence/evidence/V8/
            projects/reliability-intelligence/evidence/V9/
            projects/reliability-intelligence/evidence/V10/
            projects/reliability-intelligence/evidence/V11/
            projects/reliability-intelligence/evidence/V12/
            projects/reliability-intelligence/evidence/V13/
            projects/reliability-intelligence/evidence/V14/
            projects/reliability-intelligence/evidence/V15/
            projects/reliability-intelligence/evidence/V16/
            projects/reliability-intelligence/evidence/V17/
            projects/reliability-intelligence/evidence/V18/
            projects/reliability-intelligence/evidence/V19/
            projects/reliability-intelligence/evidence/V20/
            projects/reliability-intelligence/evidence/V21/
            projects/reliability-intelligence/evidence/V22/
            projects/reliability-intelligence/evidence/V23/
            projects/reliability-intelligence/evidence/V24/
            projects/reliability-intelligence/evidence/V24_1/
          if-no-files-found: warn
          retention-days: 30
