name: Reliability Intelligence Prototype Checks

on:
  push:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'
  pull_request:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test-only coverage tool
        working-directory: projects/reliability-intelligence
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run V10 full regression, socket replay and frozen decision checks in clean snapshot
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          test -d "$tmp/projects/reliability-intelligence"
          cd "$tmp/projects/reliability-intelligence"
          PYTHONPATH=src python scripts/verify_v8.py
          PYTHONPATH=src python scripts/replay_v9.py
          PYTHONPATH=src python scripts/verify_v10.py
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V8"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V9"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V10"
          cp evidence/V8/verification.json evidence/V8/coverage.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V8/"
          cp evidence/V9/replay.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V9/"
          cp evidence/V10/verification.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V10/"
      - name: Preserve V8-V10 regression, replay and decision verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-intelligence-v10-evidence
          path: |
            projects/reliability-intelligence/evidence/V8/
            projects/reliability-intelligence/evidence/V9/
            projects/reliability-intelligence/evidence/V10/
          if-no-files-found: warn
          retention-days: 30
