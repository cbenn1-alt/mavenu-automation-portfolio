name: Reliability Intelligence Prototype Checks

on:
  push:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'
  pull_request:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test-only coverage tool
        working-directory: projects/reliability-intelligence
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run V8 regression inventory and coverage evidence
        working-directory: projects/reliability-intelligence
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/verify_v8.py
      - name: Preserve V8 evidence as an Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-intelligence-v8-evidence
          path: projects/reliability-intelligence/evidence/V8/
          if-no-files-found: warn
          retention-days: 30
