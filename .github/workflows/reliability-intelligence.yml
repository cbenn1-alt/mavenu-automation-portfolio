name: Reliability Intelligence Prototype Checks

on:
  push:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'
  pull_request:
    paths:
      - 'projects/reliability-intelligence/**'
      - '.github/workflows/reliability-intelligence.yml'

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test-only coverage tool
        working-directory: projects/reliability-intelligence
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run V16 record lineage and V8-V15 regression in clean snapshot
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          test -d "$tmp/projects/reliability-intelligence"
          cd "$tmp/projects/reliability-intelligence"
          PYTHONPATH=src python scripts/verify_v8.py
          PYTHONPATH=src python scripts/replay_v9.py
          PYTHONPATH=src python scripts/verify_v10.py
          PYTHONPATH=src python scripts/verify_v11.py
          PYTHONPATH=src python scripts/verify_v12.py
          PYTHONPATH=src python scripts/verify_v13.py
          PYTHONPATH=src python scripts/verify_v14.py
          PYTHONPATH=src python scripts/verify_v15.py
          PYTHONPATH=src python scripts/verify_v16.py
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V8"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V9"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V10"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V11"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V12"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V13"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V14"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V15"
          mkdir -p "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V16"
          cp evidence/V8/verification.json evidence/V8/coverage.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V8/"
          cp evidence/V9/replay.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V9/"
          cp evidence/V10/verification.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V10/"
          cp evidence/V11/verification.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V11/"
          cp evidence/V12/schema_validation_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V12/"
          cp evidence/V13/negative_case_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V13/"
          cp evidence/V14/repeated_ingest_comparison.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V14/"
          cp evidence/V15/conversion_reference_report.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V15/"
          cp evidence/V16/lineage_verification.json evidence/V16/record_level_trace_sample.json evidence/V16/synthetic_record_lineage.json "$GITHUB_WORKSPACE/projects/reliability-intelligence/evidence/V16/"
      - name: Preserve V8-V16 regression and record-level source lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-intelligence-v16-evidence
          path: |
            projects/reliability-intelligence/evidence/V8/
            projects/reliability-intelligence/evidence/V9/
            projects/reliability-intelligence/evidence/V10/
            projects/reliability-intelligence/evidence/V11/
            projects/reliability-intelligence/evidence/V12/
            projects/reliability-intelligence/evidence/V13/
            projects/reliability-intelligence/evidence/V14/
            projects/reliability-intelligence/evidence/V15/
            projects/reliability-intelligence/evidence/V16/
          if-no-files-found: warn
          retention-days: 30
